    <section id="associations">
    <!-- Bloc réservé aux associations -->

    <article class="association">
        <!-- <article> : une association = un bloc indépendant, répété pour chaque association -->
        <h3>Club de Basket</h3>
        <!-- Nom de l'association -->

        <p class="role">Rôle : membre </p>
        <!-- Ton rôle -->

        <p class="periode">2025 - En cours</p>
        <!-- Période -->

        <p class="lieu">ESGIS Cotonou, Bénin</p>
        <!-- Lieu -->

        <ul>
            <li>[Mission 1 : Collaboration avec mes équipier</li>
            <li>[Mission 2 : Création de conbimaison de jeu</li>
        </ul>
        <!-- <ul>/<li> : liste à puces de tes missions -->
    </article>

    <article class="association">
        <h3>Resto Chez Maman brayan</h3>
        <p class="role">serveur</p>
        <p class="periode">2023 - En cours </p>
        <p class="lieu">Dèkoubgé, Bénin</p>
        <ul>
            <li>Satisfaction de la clientel </li>
        </ul>
    </article>
</section>
